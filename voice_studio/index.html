<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASMR Voice Studio</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --line: #262932; --sunk: #0f1116;
    --text: #e9eaef; --muted: #9297a6; --accent: #7c6cff; --rec: #ff5f56;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
  }
  main { width: 100%; max-width: 660px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); color: var(--muted);
    cursor: pointer; font-size: 14px; user-select: none;
  }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); background: #1b1a2c; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
          color: var(--muted); margin: 0 0 6px; }
  textarea, select, input[type=text] {
    width: 100%; background: var(--sunk); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 12px; font: inherit; outline: none;
  }
  textarea { min-height: 130px; resize: vertical; }
  textarea:focus, select:focus, input[type=text]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; margin-top: 16px; }
  .row > div { flex: 1; min-width: 0; }
  input[type=range] { width: 100%; padding: 0; accent-color: var(--accent); border: 0; background: none; }
  .val { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .count { float: right; color: var(--muted); font-size: 12px; letter-spacing: 0; text-transform: none; }

  button {
    border: 0; border-radius: 9px; background: var(--accent); color: #fff;
    font: 600 15px/1 inherit; cursor: pointer; padding: 12px;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { margin-top: 18px; width: 100%; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text);
                 font-weight: 500; font-size: 13px; padding: 9px 14px; }
  button.ghost:hover { border-color: var(--accent); }
  button.rec { background: var(--rec); }

  audio { width: 100%; margin-top: 18px; }
  .note { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .msg { margin-top: 14px; font-size: 13px; color: #ff8080; min-height: 18px; white-space: pre-wrap; }
  a.dl { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 13px; }

  .drop {
    margin-top: 6px; border: 1px dashed var(--line); border-radius: 11px; padding: 22px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: var(--sunk);
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop strong { color: var(--text); font-weight: 600; }
  .reclane { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); display: inline-block;
         margin-right: 7px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .out { margin-top: 18px; background: var(--sunk); border: 1px solid var(--line);
         border-radius: 11px; padding: 14px; white-space: pre-wrap; line-height: 1.6; }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .spk { color: var(--accent); font-weight: 600; }
  details.adv { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 6px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px;
                        text-transform: uppercase; letter-spacing: .06em; padding: 8px 0; }
  details.adv summary:hover { color: var(--text); }
  .chk { display: flex; align-items: center; margin-top: 16px; text-transform: none;
         letter-spacing: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .chk input { width: auto; margin-right: 8px; accent-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ASMR Voice Studio</h1>
  <p class="sub">Whisper-soft speech, powered by ElevenLabs v3 — your API key stays in <code>.env</code> on this machine.</p>

  <div class="tabs" role="tablist">
    <div class="tab" id="tabTts" role="tab" aria-selected="true">Whisper</div>
    <div class="tab" id="tabStt" role="tab" aria-selected="false">Transcribe</div>
  </div>

  <!-- ================= TEXT TO SPEECH ================= -->
  <section class="panel" id="paneTts">
    <label>Text <span class="count" id="count">0 chars</span></label>
    <textarea id="text" placeholder="Type something to whisper...">Close your eyes. Let your shoulders drop. Everything can wait until morning.</textarea>

    <div class="row">
      <div>
        <label>Voice</label>
        <select id="voice"><option>Loading voices…</option></select>
      </div>
      <div>
        <label>Delivery</label>
        <select id="preset">
          <option value="whisper">Soft whisper</option>
          <option value="asmr" selected>ASMR close-up</option>
          <option value="tingles">Trigger words / tingles</option>
          <option value="bedtime">Bedtime story</option>
          <option value="meditation">Guided meditation</option>
          <option value="sleep">Sleep hypnosis</option>
          <option value="affirm">Gentle affirmations</option>
          <option value="custom">Custom…</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Tone tag</label>
        <input type="text" id="tag" placeholder="[whispers, breathy]">
      </div>
      <div>
        <label>Pacing</label>
        <select id="pauses">
          <option value="0">Flowing</option>
          <option value="1" selected>Gentle pauses</option>
          <option value="2">Long, drifting pauses</option>
        </select>
      </div>
    </div>

    <details class="adv">
      <summary>Fine tuning</summary>
      <div class="row">
        <div>
          <label>Stability <span class="val" id="stabVal">1.00</span></label>
          <input type="range" id="stability" min="0" max="1" step="0.5" value="1">
        </div>
        <div>
          <label>Similarity <span class="val" id="simVal">0.85</span></label>
          <input type="range" id="similarity" min="0" max="1" step="0.05" value="0.85">
        </div>
        <div>
          <label>Style <span class="val" id="styleVal">0.05</span></label>
          <input type="range" id="style" min="0" max="1" step="0.05" value="0.05">
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="allVoices"> Show all voices, not just the calm ones</label>
    </details>

    <button class="primary" id="go">Whisper it</button>
    <div class="note" id="note" hidden></div>
    <div class="msg" id="msg"></div>
    <audio id="player" controls hidden></audio>
    <a class="dl" id="dl" hidden download="speech.mp3">Download mp3</a>
  </section>

  <!-- ================= SPEECH TO TEXT ================= -->
  <section class="panel" id="paneStt" hidden>
    <label>Audio</label>
    <div class="drop" id="drop">
      <strong>Choose an audio or video file</strong><br>drop it here, or click to browse
    </div>
    <input type="file" id="file" accept="audio/*,video/*" hidden>

    <div class="reclane">
      <button class="ghost" id="recBtn">Record from mic</button>
      <span class="timer" id="timer"></span>
    </div>

    <div class="row">
      <div>
        <label>Model</label>
        <select id="sttModel">
          <option value="scribe_v1">Scribe v1</option>
          <option value="scribe_v1_experimental">Scribe v1 experimental</option>
        </select>
      </div>
      <div>
        <label>Language</label>
        <input type="text" id="lang" placeholder="auto-detect (or: en, hi, es…)">
      </div>
    </div>

    <div class="reclane">
      <label style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);cursor:pointer">
        <input type="checkbox" id="diarize" style="width:auto;margin-right:8px;accent-color:var(--accent)">
        Identify speakers (diarize)
      </label>
    </div>

    <button class="primary" id="transcribe" disabled>Transcribe</button>
    <div class="msg" id="sttMsg"></div>

    <div id="sttResult" hidden>
      <div class="out" id="out"></div>
      <div class="meta" id="outMeta"></div>
      <div class="acts">
        <button class="ghost" id="copy">Copy text</button>
        <button class="ghost" id="toTts">Send to Whisper</button>
        <button class="ghost" id="saveTxt">Download .txt</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

/* ---------------- tabs ---------------- */
function showTab(which) {
  const tts = which === 'tts';
  $('tabTts').setAttribute('aria-selected', tts);
  $('tabStt').setAttribute('aria-selected', !tts);
  $('paneTts').hidden = !tts;
  $('paneStt').hidden = tts;
}
$('tabTts').onclick = () => showTab('tts');
$('tabStt').onclick = () => showTab('stt');

/* ---------------- text to speech ---------------- */
const msg = t => $('msg').textContent = t;

$('text').addEventListener('input', e => $('count').textContent = e.target.value.length + ' chars');
$('count').textContent = $('text').value.length + ' chars';

/* Every preset runs on eleven_v3 — it is the only model that understands the
   inline audio tags, which is what makes a real whisper instead of a quiet read. */
const PRESETS = {
  whisper:    { stability: 1.0, similarity: .85, style: .10, pauses: 1, tag: '[whispers]' },
  asmr:       { stability: 1.0, similarity: .90, style: .05, pauses: 2, tag: '[whispers, breathy, very softly, close to the mic]' },
  tingles:    { stability: 1.0, similarity: .90, style: .15, pauses: 2, tag: '[whispers, breathy, slowly, gently]' },
  bedtime:    { stability: 1.0, similarity: .80, style: .25, pauses: 1, tag: '[softly, gentle, calm, slow]' },
  meditation: { stability: 1.0, similarity: .85, style: .05, pauses: 2, tag: '[calm, soothing, slow, peaceful]' },
  sleep:      { stability: 1.0, similarity: .85, style: .00, pauses: 2, tag: '[whispers, monotone, very slowly, drowsy]' },
  affirm:     { stability: 0.5, similarity: .85, style: .20, pauses: 1, tag: '[warm, soft, reassuring, slowly]' },
};

let syncing = false;
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  syncing = true;
  $('stability').value = p.stability;
  $('similarity').value = p.similarity;
  $('style').value = p.style;
  $('pauses').value = p.pauses;
  $('tag').value = p.tag;
  syncing = false;
  refreshLabels();
}
function refreshLabels() {
  $('stabVal').textContent = (+$('stability').value).toFixed(2);
  $('simVal').textContent = (+$('similarity').value).toFixed(2);
  $('styleVal').textContent = (+$('style').value).toFixed(2);
}
$('preset').addEventListener('change', e => applyPreset(e.target.value));
for (const id of ['stability', 'similarity', 'style', 'pauses', 'tag']) {
  $(id).addEventListener('input', () => {
    if (!syncing) $('preset').value = 'custom';
    refreshLabels();
  });
}
$('allVoices').addEventListener('change', loadVoices);
applyPreset('asmr');

async function loadVoices() {
  try {
    const r = await fetch($('allVoices').checked ? '/voices?all=1' : '/voices');
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail?.message || d.detail || 'could not load voices');
    const sel = $('voice');
    sel.innerHTML = '';
    const mk = v => {
      const o = document.createElement('option');
      o.value = v.id;
      const tags = [v.labels?.accent, v.labels?.gender].filter(Boolean).join(', ');
      o.textContent = tags ? `${v.name} — ${tags}` : v.name;
      return o;
    };
    d.voices.forEach(v => sel.appendChild(mk(v)));
    if (d.source === 'builtin') {
      $('note').textContent = 'Built-in ElevenLabs voices, filtered to the calm ones — your API key lacks the voices_read permission, so your own voices can’t be listed.';
      $('note').hidden = false;
    }
  } catch (e) {
    $('voice').innerHTML = '<option>—</option>';
    msg(String(e.message || e));
  }
}

let lastUrl = null;
$('go').addEventListener('click', async () => {
  const text = $('text').value.trim();
  if (!text) return msg('Enter some text first.');
  msg(''); $('go').disabled = true; $('go').textContent = 'Generating…';
  try {
    const r = await fetch('/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        voice_id: $('voice').value,
        model_id: 'eleven_v3',
        stability: +$('stability').value,
        similarity: +$('similarity').value,
        style: +$('style').value,
        pauses: +$('pauses').value,
        tag: $('tag').value,
      }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail?.message || JSON.stringify(d.detail || 'request failed'));
    }
    const blob = await r.blob();
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    $('player').src = lastUrl; $('player').hidden = false; $('player').play();
    $('dl').href = lastUrl; $('dl').hidden = false;
  } catch (e) {
    msg(String(e.message || e));
  } finally {
    $('go').disabled = false; $('go').textContent = 'Whisper it';
  }
});

/* ---------------- speech to text ---------------- */
const sttMsg = t => $('sttMsg').textContent = t;
let audioBlob = null, audioName = '';

function setAudio(blob, name) {
  audioBlob = blob; audioName = name;
  const kb = (blob.size / 1024).toFixed(0);
  $('drop').innerHTML = `<strong>${name}</strong><br>${kb} KB · click to pick a different file`;
  $('transcribe').disabled = false;
  sttMsg('');
}

$('drop').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) setAudio(f, f.name); };
['dragenter', 'dragover'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', e => {
  const f = e.dataTransfer.files[0]; if (f) setAudio(f, f.name);
});

let recorder = null, chunks = [], tick = null, startedAt = 0;
$('recBtn').onclick = async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(tick);
      $('recBtn').textContent = 'Record from mic';
      $('recBtn').classList.remove('rec');
      $('timer').innerHTML = '';
      const type = recorder.mimeType || 'audio/webm';
      const ext = type.includes('ogg') ? 'ogg' : type.includes('mp4') ? 'mp4' : 'webm';
      setAudio(new Blob(chunks, { type }), `recording.${ext}`);
    };
    recorder.start();
    startedAt = Date.now();
    $('recBtn').textContent = 'Stop recording';
    $('recBtn').classList.add('rec');
    tick = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('timer').innerHTML = `<span class="dot"></span>${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 200);
  } catch (e) {
    sttMsg('Microphone unavailable: ' + (e.message || e));
  }
};

function render(d) {
  const segs = (d.words || []).filter(w => w.type !== 'spacing');
  const speakers = new Set(segs.map(w => w.speaker_id).filter(Boolean));
  if ($('diarize').checked && speakers.size > 1) {
    let html = '', current = null;
    for (const w of (d.words || [])) {
      if (w.type === 'spacing') { html += w.text ?? ' '; continue; }
      if (w.speaker_id !== current) {
        current = w.speaker_id;
        html += `${html ? '\n\n' : ''}<span class="spk">${current}:</span> `;
      }
      html += (w.text || '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    }
    $('out').innerHTML = html;
  } else {
    $('out').textContent = d.text || '(no speech detected)';
  }
  const bits = [];
  if (d.language_code) bits.push('language: ' + d.language_code);
  if (typeof d.language_probability === 'number') bits.push('confidence: ' + (d.language_probability * 100).toFixed(0) + '%');
  if (speakers.size) bits.push(speakers.size + ' speaker' + (speakers.size > 1 ? 's' : ''));
  bits.push((d.text || '').split(/\s+/).filter(Boolean).length + ' words');
  $('outMeta').textContent = bits.join(' · ');
  $('sttResult').hidden = false;
}

let lastText = '';
$('transcribe').onclick = async () => {
  if (!audioBlob) return sttMsg('Pick a file or record something first.');
  sttMsg(''); $('sttResult').hidden = true;
  $('transcribe').disabled = true; $('transcribe').textContent = 'Transcribing…';
  try {
    const headers = {
      'Content-Type': 'application/octet-stream',
      'X-Filename': audioName.replace(/[^\w.\- ]/g, '_'),
      'X-Audio-Type': audioBlob.type || 'application/octet-stream',
      'X-Model': $('sttModel').value,
      'X-Diarize': $('diarize').checked ? '1' : '0',
    };
    const lang = $('lang').value.trim();
    if (lang) headers['X-Language'] = lang;

    const r = await fetch('/stt', { method: 'POST', headers, body: audioBlob });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail?.message || JSON.stringify(d.detail || 'request failed'));
    lastText = d.text || '';
    render(d);
  } catch (e) {
    sttMsg(String(e.message || e));
  } finally {
    $('transcribe').disabled = false; $('transcribe').textContent = 'Transcribe';
  }
};

$('copy').onclick = async () => {
  await navigator.clipboard.writeText(lastText);
  $('copy').textContent = 'Copied';
  setTimeout(() => $('copy').textContent = 'Copy text', 1200);
};
$('toTts').onclick = () => {
  $('text').value = lastText;
  $('count').textContent = lastText.length + ' chars';
  showTab('tts');
};
$('saveTxt').onclick = () => {
  const url = URL.createObjectURL(new Blob([lastText], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'transcript.txt'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

loadVoices();
</script>
</body>
</html>
