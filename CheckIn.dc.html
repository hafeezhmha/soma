<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Work+Sans:wght@400;500&display=swap">
  <style>
    :root{--bg:#fcfcfb;--surface:#eef1ec;--surface-hover:#e7ebe5;--line:#cdd6cb;--line-quiet:#e4e7e2;--accent:#4a7360;--accent-hover:#446a58;--accent-soft:#b7c6b4;--ink-quiet:#576357;--ink-label:#5a6a5a;--ink-body:#4a5450;--ink:#2b322c;--placeholder:#9aa79a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);font-family:'Work Sans',system-ui,sans-serif;color:var(--ink-body);-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);} a:hover{color:var(--accent-hover);}
    .screen{width:390px;height:844px;padding:64px 24px 32px;display:flex;flex-direction:column;overflow:hidden;}
    .display{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:40px;line-height:1.05;color:var(--ink);margin:0;max-width:9ch;}
    .reflective{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:17px;line-height:1.6;color:var(--ink-body);}
    .microlabel{font-family:'Work Sans';font-weight:500;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-label);}
    .caption{font-size:11px;line-height:1.5;color:var(--ink-quiet);}
    .btn{font-family:'Work Sans';font-weight:400;font-size:13px;border-radius:999px;padding:12px 24px;border:none;cursor:pointer;}
    .btn-primary{background:var(--accent);color:var(--bg);}
    .btn-primary:hover{background:var(--accent-hover);}
    .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--ink-body);padding:11px 23px;}
  </style>
</helmet>
<div class="screen">
  <div class="microlabel">Check in</div>
  <h1 class="display" style="margin-top:22px;">How are you feeling?</h1>
  <p class="reflective" style="margin:16px 0 0;max-width:40ch;">Notice what's here, without fixing it. Choose what fits — or more than one.</p>

  <div class="microlabel" style="margin-top:44px;">Right now I feel</div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="8">
      <button style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow:1;"></div>
  <p class="caption" style="margin-bottom:16px;">A short guided check-in follows — voice or tap, your choice.</p>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" style="flex-grow:1;">Begin check-in</button>
    <button class="btn btn-secondary">Not now</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { picked: {} }; }
  renderVals() {
    const feelings = ['scattered','wired','heavy','foggy','tender','raw','quiet','okay'];
    const picked = this.state.picked || {};
    const base = "font-family:'Work Sans';font-size:13px;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);";
    const chips = feelings.map((f) => ({
      label: f,
      pick: () => { const n = { ...(this.state.picked||{}) }; n[f] = !n[f]; this.setState({ picked: n }); },
      style: base + (picked[f]
        ? 'background:var(--accent);color:var(--bg);border-color:var(--accent);'
        : 'background:var(--surface);color:var(--ink-body);'),
    }));
    return { chips };
  }
}
</script>
</body>
</html>
