[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soma-ifs-assistant"
version = "0.1.0"
description = "Vector storage foundation for an IFS assistant"
requires-python = ">=3.10"
dependencies = [
  "actian-vectorai-client",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rag = ["sentence-transformers>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ifs_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "backend/tests"]
