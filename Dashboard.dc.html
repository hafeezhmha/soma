<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Work+Sans:wght@400;500&display=swap">
  <style>
    :root{--bg:#fcfcfb;--surface:#eef1ec;--surface-hover:#e7ebe5;--line:#cdd6cb;--line-quiet:#e4e7e2;--accent:#4a7360;--accent-hover:#446a58;--accent-soft:#b7c6b4;--ink-quiet:#576357;--ink-label:#5a6a5a;--ink-body:#4a5450;--ink:#2b322c;--placeholder:#9aa79a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);font-family:'Work Sans',system-ui,sans-serif;color:var(--ink-body);-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);} a:hover{color:var(--accent-hover);}
    .screen{width:390px;height:940px;padding:64px 24px 32px;display:flex;flex-direction:column;overflow:hidden;}
    .display{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:40px;line-height:1.05;color:var(--ink);margin:0;}
    .reflective{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:17px;line-height:1.6;color:var(--ink-body);}
    .microlabel{font-family:'Work Sans';font-weight:500;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-label);}
    .caption{font-size:11px;line-height:1.5;color:var(--ink-quiet);}
    .divider{height:1px;background:var(--line-quiet);width:100%;margin:32px 0;}
    .partname{font-family:'Work Sans';font-weight:400;font-size:13px;color:var(--ink-body);}
  </style>
</helmet>
<div class="screen">
  <div class="microlabel">Your parts</div>
  <h1 class="display" style="margin-top:22px;">This week</h1>
  <p class="reflective" style="margin:12px 0 0;max-width:38ch;">Which parts have been with you, and how often. Nothing to keep up — just noticing.</p>

  <div class="microlabel" style="margin-top:40px;">Showed up</div>
  <div style="margin-top:18px;display:flex;flex-direction:column;gap:20px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:104px;display:flex;align-items:center;gap:8px;flex:none;">
          <span style="{{row.dotStyle}}"></span>
          <span class="partname">{{row.name}}</span>
        </div>
        <div style="display:flex;gap:11px;">
          <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="7">
            <span style="{{cell.style}}"></span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;gap:11px;margin-top:12px;padding-left:118px;">
    <span class="caption" style="width:12px;text-align:center;">M</span>
    <span class="caption" style="width:12px;text-align:center;">T</span>
    <span class="caption" style="width:12px;text-align:center;">W</span>
    <span class="caption" style="width:12px;text-align:center;">T</span>
    <span class="caption" style="width:12px;text-align:center;">F</span>
    <span class="caption" style="width:12px;text-align:center;">S</span>
    <span class="caption" style="width:12px;text-align:center;">S</span>
  </div>

  <div class="divider"></div>

  <div class="microlabel">Parts you've met</div>
  <div style="margin-top:18px;display:flex;flex-direction:column;gap:16px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="{{row.dotStyle}}"></span>
        <span class="partname" style="flex-grow:1;">{{row.name}}</span>
        <span class="caption">last seen {{row.last}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const parts = [
      { name: 'the teenager',  color: 'var(--accent)',      days: [1,0,1,1,0,1,0], last: 'Sep 5 · jaw' },
      { name: 'the planner',   color: 'var(--accent-soft)', days: [1,1,1,1,1,0,0], last: 'Sep 4 · shoulders' },
      { name: 'the small one', color: 'var(--accent-soft)', days: [0,1,0,0,1,0,1], last: 'Sep 2 · chest' },
    ];
    const dot = (c) => 'width:9px;height:9px;border-radius:999px;flex:none;display:inline-block;background:' + c + ';';
    const rows = parts.map((p) => ({
      name: p.name,
      last: p.last,
      dotStyle: dot(p.color),
      cells: p.days.map((d) => ({
        style: d
          ? 'width:12px;height:12px;border-radius:999px;display:inline-block;background:' + p.color + ';'
          : 'width:12px;height:12px;border-radius:999px;display:inline-block;border:1.5px solid var(--line-quiet);',
      })),
    }));
    return { rows };
  }
}
</script>
</body>
</html>
